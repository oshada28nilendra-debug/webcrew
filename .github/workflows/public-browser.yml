name: public-browser-integration
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: PYTHONPATH=. python scripts/public_smoke.py --out delivery/ci-public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-public-browser-evidence
          path: delivery/ci-public
