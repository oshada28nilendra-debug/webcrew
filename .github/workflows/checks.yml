name: checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: python -m unittest discover -v
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python -m compileall -q webcrew && python -m build --wheel --no-isolation
      - run: PYTHONPATH=. python scripts/demo.py --out /tmp/webcrew-demo
      - if: matrix.python == '3.12'
        run: python scripts/secret_scan.py --report /tmp/gitleaks.json
