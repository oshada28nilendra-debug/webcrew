name: real-local-model
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: python scripts/download_model.py --out /tmp/webcrew-model
      - run: PYTHONPATH=. python scripts/live_smoke.py --runtime /tmp/webcrew-model --out delivery/ci-live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-local-model-evidence
          path: delivery/ci-live
