[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webcrew-local"
version = "0.1.0"
description = "Bounded AI browser investigations with persisted evidence and fresh verification"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["playwright==1.61.0"]

[project.optional-dependencies]
dev = ["ruff==0.15.7", "build==1.4.0"]

[project.scripts]
webcrew = "webcrew.cli:main"

[tool.setuptools.packages.find]
include = ["webcrew*"]

[tool.ruff]
target-version = "py311"
line-length = 100
